<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

body {

  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 40px 15px;
}

  font-size: 38px;
  color: #facc15;
  margin-bottom: 5px;

}

  font-weight: bold;
